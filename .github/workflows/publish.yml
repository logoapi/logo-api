name: publish

# Stages a new logoapi version on npm when a v*.*.* tag is pushed.
# Trusted publishing (OIDC) only: no tokens, no secrets. The trusted publisher
# on npm allows staging only, so a maintainer approves each version in npm.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm stage needs npm 11.15.0 or newer (trusted publishing needs 11.5.1).
      - name: Install npm
        run: npm install -g npm@11.21.1

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag commit is not on main"; exit 1; }
          # react-stock-logo has its own version line (0.1.x), so it is not in this tag check.
          for pkg in logoapi ticker-logos crypto-logos stock-ticker-logos etf-logos; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match $pkg version $version"; exit 1; }
          done

      - name: No install scripts
        run: |
          set -euo pipefail
          for pkg in logoapi ticker-logos crypto-logos stock-ticker-logos etf-logos react-stock-logo; do
            for script in install preinstall postinstall; do
              found=$(PKG="$pkg" SCRIPT="$script" node -e "const p=require('./packages/'+process.env.PKG+'/package.json'); process.stdout.write(p.scripts && p.scripts[process.env.SCRIPT] ? 'yes' : '')")
              if [ -n "$found" ]; then
                echo "::error::Package $pkg has a $script script. Install scripts are not allowed."
                exit 1
              fi
            done
            # npm runs node-gyp rebuild on install when binding.gyp exists, even with no install script.
            if [ -e "packages/$pkg/binding.gyp" ]; then
              echo "::error::Package $pkg has a binding.gyp (implicit install script). Install scripts are not allowed."
              exit 1
            fi
          done

      # Order matters: logoapi first, the others depend on it.
      - name: Test all packages
        run: |
          set -euo pipefail
          for pkg in logoapi ticker-logos crypto-logos stock-ticker-logos etf-logos react-stock-logo; do
            cd "packages/$pkg"
            # Dependents test against the sibling logoapi from this commit: the new
            # logoapi version is only staged, not yet on the registry.
            if grep -q '"dependencies"' package.json; then npm install --no-audit --no-fund --no-save ../logoapi; fi
            if npm run | grep -q '^  prepack'; then npm run prepack; fi
            if npm run | grep -q '^  test'; then npm test; fi
            cd ../..
          done

      - name: Stage publish
        run: |
          set -euo pipefail
          for pkg in logoapi ticker-logos crypto-logos; do
            echo "::group::stage $pkg"
            (cd "packages/$pkg" && npm stage publish --provenance --access public)
            echo "::endgroup::"
          done
          # stock-ticker-logos: a new name needs one manual first publish and a trusted
          # publisher on npm before this job can stage it. Skip it until it exists.
          if npm view stock-ticker-logos name >/dev/null 2>&1; then
            echo "::group::stage stock-ticker-logos"
            (cd packages/stock-ticker-logos && npm stage publish --provenance --access public)
            echo "::endgroup::"
          else
            echo "::notice::stock-ticker-logos is not on npm yet: first publish is manual"
          fi
          # etf-logos: same rule. Skip until the manual first publish and trusted publisher exist.
          if npm view etf-logos name >/dev/null 2>&1; then
            echo "::group::stage etf-logos"
            (cd packages/etf-logos && npm stage publish --provenance --access public)
            echo "::endgroup::"
          else
            echo "::notice::etf-logos is not on npm yet: first publish is manual"
          fi
          # react-stock-logo: same rule. Skip until the manual first publish and trusted publisher exist.
          rsl_version=$(node -p "require('./packages/react-stock-logo/package.json').version")
          if ! npm view react-stock-logo name >/dev/null 2>&1; then
            echo "::notice::react-stock-logo is not on npm yet: first publish is manual"
          elif [ -n "$(npm view "react-stock-logo@$rsl_version" version 2>/dev/null)" ]; then
            echo "::notice::react-stock-logo $rsl_version is already on npm: nothing to stage"
          else
            echo "::group::stage react-stock-logo"
            (cd packages/react-stock-logo && npm stage publish --provenance --access public)
            echo "::endgroup::"
          fi
